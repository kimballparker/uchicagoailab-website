<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 270" role="img" aria-labelledby="t d">
  <title id="t">Why privilege doesn't map onto AI</title>
  <desc id="d">Three panels. A conversation with a lawyer, doctor, or therapist is privileged because it is between two people. A conversation with an AI assistant today generally is not protected, because there is no person on the other side. The Lab's platform aims to protect that conversation.</desc>
  <style>
    .h{font:600 11.5px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.06em;fill:#5f5757}
    .p{font:600 13px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    .c{font:500 13px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5f5757}
  </style>
  <defs>
    <g id="person"><circle cx="0" cy="-12" r="10"/><path d="M-17 18a17 17 0 0 1 34 0z"/></g>
    <g id="ai"><rect x="-18" y="-18" width="36" height="36" rx="9"/><circle cx="-6" cy="-3" r="3" fill="#fff"/><circle cx="6" cy="-3" r="3" fill="#fff"/><path d="M-6 8h12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></g>
    <path id="shield" d="M0-14L12-9V1C12 9 6 14 0 17C-6 14-12 9-12 1V-9Z"/>
  </defs>
  <!-- Card 1 -->
  <g transform="translate(0 0)">
    <rect width="236" height="270" rx="18" fill="#ffffff"/>
    <text class="h" x="118" y="38" text-anchor="middle">LAWYER · DOCTOR · THERAPIST</text>
    <use href="#person" x="58" y="104" fill="#1b1414"/>
    <use href="#person" x="178" y="104" fill="#1b1414"/>
    <line x1="82" y1="104" x2="154" y2="104" stroke="#800000" stroke-width="3"/>
    <circle cx="118" cy="104" r="20" fill="#ffffff"/>
    <use href="#shield" x="118" y="102" fill="#800000"/>
    <rect x="68" y="160" width="100" height="30" rx="15" fill="#800000"/>
    <text class="p" x="118" y="180" fill="#fff" text-anchor="middle">Privileged</text>
    <text class="c" x="118" y="214" text-anchor="middle">A relationship</text>
    <text class="c" x="118" y="232" text-anchor="middle">between two people</text>
  </g>
  <!-- Card 2 -->
  <g transform="translate(252 0)">
    <rect width="236" height="270" rx="18" fill="#ffffff"/>
    <text class="h" x="118" y="38" text-anchor="middle">AI ASSISTANT TODAY</text>
    <use href="#person" x="58" y="104" fill="#1b1414"/>
    <use href="#ai" x="178" y="104" fill="#767676"/>
    <line x1="82" y1="104" x2="154" y2="104" stroke="#767676" stroke-width="3" stroke-dasharray="6 6"/>
    <circle cx="118" cy="104" r="20" fill="#ffffff"/>
    <g transform="translate(118 106)" fill="none" stroke="#767676" stroke-width="2.5" stroke-linecap="round">
      <rect x="-10" y="-4" width="20" height="15" rx="3" fill="#767676" stroke="none"/>
      <path d="M-6-4v-6a6 6 0 0 1 11.5-2.4"/>
    </g>
    <rect x="23" y="160" width="190" height="30" rx="15" fill="#ecebe4"/>
    <text class="p" x="118" y="180" fill="#1b1414" text-anchor="middle">Generally not protected</text>
    <text class="c" x="118" y="214" text-anchor="middle">No person on</text>
    <text class="c" x="118" y="232" text-anchor="middle">the other side</text>
  </g>
  <!-- Card 3 -->
  <g transform="translate(504 0)">
    <rect width="236" height="270" rx="18" fill="#ffffff"/>
    <text class="h" x="118" y="38" text-anchor="middle">THE LAB'S PLATFORM</text>
    <rect x="22" y="62" width="192" height="84" rx="14" fill="#fff6e6" stroke="#ffa319" stroke-width="2" stroke-dasharray="5 5"/>
    <use href="#person" x="58" y="104" fill="#1b1414"/>
    <use href="#ai" x="178" y="104" fill="#800000"/>
    <line x1="82" y1="104" x2="154" y2="104" stroke="#ffa319" stroke-width="3"/>
    <circle cx="118" cy="104" r="20" fill="#fff6e6"/>
    <use href="#shield" x="118" y="102" fill="#ffa319"/>
    <rect x="68" y="160" width="100" height="30" rx="15" fill="#ffa319"/>
    <text class="p" x="118" y="180" fill="#1b1414" text-anchor="middle">Protected</text>
    <text class="c" x="118" y="214" text-anchor="middle">Real help from AI,</text>
    <text class="c" x="118" y="232" text-anchor="middle">without giving up protection</text>
  </g>
</svg>
