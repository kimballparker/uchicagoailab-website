<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 432" role="img" aria-labelledby="t d">
  <title id="t">Growth opens a gap between founders, and the gap produces tension</title>
  <desc id="d">The company grows. It needs a specialist for each function the founders covered on the side, so the other founders keep their specialty and give up the rest. Specialists need someone who sees across every function, so the CEO stops doing the work and keeps authority over all of it. Founders who began as peers are no longer peers. The result is tension that can contribute to the team breaking apart.</desc>
  <style>
    .in{font:600 15px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1b1414}
    .bx{font:500 13.5px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1b1414}
    .box{fill:#ecebe4}
    .arr{fill:none;stroke:#767676;stroke-width:1.5}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#767676"/>
    </marker>
  </defs>
  <rect width="740" height="432" rx="18" fill="#ffffff"/>

  <g class="arr">
    <path d="M370 68V84H193V98" marker-end="url(#arrow)"/>
    <path d="M370 68V84H547V98" marker-end="url(#arrow)"/>
    <path d="M193 158V186" marker-end="url(#arrow)"/>
    <path d="M547 158V186" marker-end="url(#arrow)"/>
    <path d="M193 246V274" marker-end="url(#arrow)"/>
    <path d="M547 246V274" marker-end="url(#arrow)"/>
    <path d="M370 326V354" marker-end="url(#arrow)"/>
  </g>

  <g text-anchor="middle">
    <rect class="box" x="250" y="28" width="240" height="40" rx="8"/>
    <text class="in" x="370" y="53">The company grows</text>

    <rect class="box" x="28" y="100" width="330" height="58" rx="8"/>
    <text class="bx" x="193" y="125">It needs a specialist for each function</text>
    <text class="bx" x="193" y="143">the founders covered on the side</text>

    <rect class="box" x="382" y="100" width="330" height="58" rx="8"/>
    <text class="bx" x="547" y="125">Specialists need someone who</text>
    <text class="bx" x="547" y="143">sees across every function</text>

    <rect class="box" x="28" y="188" width="330" height="58" rx="8"/>
    <text class="bx" x="193" y="213">The other founders keep their</text>
    <text class="bx" x="193" y="231">specialty and give up the rest</text>

    <rect class="box" x="382" y="188" width="330" height="58" rx="8"/>
    <text class="bx" x="547" y="213">The CEO stops doing the work</text>
    <text class="bx" x="547" y="231">and keeps authority over all of it</text>

    <rect x="28" y="276" width="684" height="50" rx="8" fill="#800000"/>
    <text class="in" x="370" y="306" style="fill:#ffffff">Founders who began as peers are no longer peers</text>

    <rect class="box" x="160" y="356" width="420" height="48" rx="8"/>
    <text class="bx" x="370" y="385">Tension that can contribute to the team breaking apart</text>
  </g>
</svg>
