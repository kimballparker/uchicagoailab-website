<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 430" role="img" aria-labelledby="t d">
  <title id="t">Growth narrows every role but one</title>
  <desc id="d">At founding, the CEO covers product and sales, the technical founder covers engineering, marketing, and finance, and the operations founder covers operations, HR, and customer success. After growth, the CEO oversees every function. The technical founder runs engineering and the operations founder runs operations. Specialists hired as the company grew run sales, marketing, finance, HR, and customer success.</desc>
  <style>
    .lbl{font:600 12px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.12em;fill:#5f5757;text-transform:uppercase}
    .in{font:600 15px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1b1414}
    .fn{font:500 13.5px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1b1414}
    .bx{font:600 12.5px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#1b1414}
    .sm{font:500 12px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#5f5757}
    .founder{fill:#ecebe4}
    .hire{fill:#ffffff;stroke:#767676;stroke-width:1.25;stroke-dasharray:4 3}
  </style>
  <rect width="740" height="430" rx="18" fill="#ffffff"/>

  <text class="lbl" x="28" y="46">At founding</text>
  <g text-anchor="middle">
    <rect class="founder" x="28" y="60" width="216" height="104" rx="8"/>
    <text class="in" x="136" y="88">CEO</text>
    <text class="fn" x="136" y="114">Product</text>
    <text class="fn" x="136" y="133">Sales</text>

    <rect class="founder" x="262" y="60" width="216" height="104" rx="8"/>
    <text class="in" x="370" y="88">Technical founder</text>
    <text class="fn" x="370" y="114">Engineering</text>
    <text class="fn" x="370" y="133">Marketing</text>
    <text class="fn" x="370" y="152">Finance</text>

    <rect class="founder" x="496" y="60" width="216" height="104" rx="8"/>
    <text class="in" x="604" y="88">Operations founder</text>
    <text class="fn" x="604" y="114">Operations</text>
    <text class="fn" x="604" y="133">HR</text>
    <text class="fn" x="604" y="152">Customer success</text>
  </g>

  <text class="lbl" x="28" y="214">After growth</text>
  <rect x="28" y="228" width="684" height="48" rx="8" fill="#800000"/>
  <text class="in" x="370" y="257" text-anchor="middle" style="fill:#ffffff">CEO: oversees every function</text>

  <g fill="none" stroke="#d6d6ce" stroke-width="2">
    <path d="M370 276V292"/>
    <path d="M72 292H668"/>
    <path d="M72 292V308M171.3 292V308M270.7 292V308M370 292V308M469.3 292V308M568.7 292V308M668 292V308"/>
  </g>

  <g text-anchor="middle">
    <rect class="hire" x="28" y="308" width="88" height="70" rx="8"/>
    <text class="bx" x="72" y="334">Sales</text>
    <text class="sm" x="72" y="356">Specialist</text>

    <rect class="hire" x="127.3" y="308" width="88" height="70" rx="8"/>
    <text class="bx" x="171.3" y="334">Marketing</text>
    <text class="sm" x="171.3" y="356">Specialist</text>

    <rect class="founder" x="226.7" y="308" width="88" height="70" rx="8"/>
    <text class="bx" x="270.7" y="334">Engineering</text>
    <text class="sm" x="270.7" y="352">Technical</text>
    <text class="sm" x="270.7" y="367">founder</text>

    <rect class="hire" x="326" y="308" width="88" height="70" rx="8"/>
    <text class="bx" x="370" y="334">Finance</text>
    <text class="sm" x="370" y="356">Specialist</text>

    <rect class="founder" x="425.3" y="308" width="88" height="70" rx="8"/>
    <text class="bx" x="469.3" y="334">Operations</text>
    <text class="sm" x="469.3" y="352">Operations</text>
    <text class="sm" x="469.3" y="367">founder</text>

    <rect class="hire" x="524.7" y="308" width="88" height="70" rx="8"/>
    <text class="bx" x="568.7" y="334">HR</text>
    <text class="sm" x="568.7" y="356">Specialist</text>

    <rect class="hire" x="624" y="308" width="88" height="70" rx="8"/>
    <text class="bx" x="668" y="329">Customer</text>
    <text class="bx" x="668" y="344">success</text>
    <text class="sm" x="668" y="365">Specialist</text>
  </g>

  <rect class="founder" x="28" y="396" width="14" height="14" rx="3"/>
  <text class="sm" x="50" y="407">Founder</text>
  <rect class="hire" x="120" y="396" width="14" height="14" rx="3"/>
  <text class="sm" x="142" y="407">Specialist hired as the company grew</text>
</svg>
